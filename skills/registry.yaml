standalone_skills:
  skill-creator:
    path: references/external-skills/skill-creator/SKILL.md
external_skills:
  math-modeling-paper-review:
    discovery: installed-skill
    expected_name: math-modeling-paper-review
    installed_path_hint: $CODEX_HOME/skills/math-modeling-paper-review/SKILL.md
    fallback: skills/competition-scoring/SKILL.md
    invoke_after: complete-paper-compiled
stage_routes:
  G0: [workflow-orchestration, plan-and-execution, ai-use-disclosure]
  G1: [problem-forensics, data-analysis, jupyter-live-analysis]
  "G1.5": [literature-evidence, exemplar-distillation]
  G2: [model-deliberation, model-formulation-and-solving, plan-and-execution]
  G3: [model-formulation-and-solving, data-analysis, jupyter-live-analysis, sql-data-analysis]
  "G3.5": [validation-and-robustness, measured-experiment-loop]
  G4: [scientific-visualization, technical-diagrams, scientific-tables, academic-writing, national-award-paper-style, academic-translation, research-presentation]
  G5: [reproducibility-audit, academic-writing, national-award-paper-style]
  G6: [competition-scoring, math-modeling-paper-review, reproducibility-audit, academic-writing, academic-humanization]
  G7: [submission-packaging, reproducibility-audit, ai-use-disclosure]
conditional_routes:
  derivation-or-proof-critical:
    when: a material result depends on a nontrivial formula derivation, theorem, proposition, error bound, approximation chain, or algorithmic guarantee
    stages: [G2, G3, G4, G6]
    skills: [mathematical-derivation-and-proof]
  external-data-needed:
    when: the model needs public APIs, portals, repositories, webpages, or secondary datasets beyond official attachments
    stages: [G0, G1, "G1.5", G3, G5, G6]
    skills: [external-data-acquisition]
  prospective-or-controlled-experiment:
    when: the project controls assignment, data collection, simulation runs, algorithm comparisons, factorial settings, or a causal estimand
    stages: [G1, G2, G3, "G3.5", G6]
    skills: [experimental-design-and-inference]
  temporal-prediction:
    when: target is ordered by time or a future horizon is requested
    stages: [G1, G2, G3, "G3.5", G4, G6]
    skills: [forecasting-and-backtesting]
  stochastic-or-event-system:
    when: random inputs, queues, resources, scenarios, or uncertainty propagation affect conclusions
    stages: [G2, G3, "G3.5", G4, G6]
    skills: [simulation-and-uncertainty]
  spatial-system:
    when: coordinates, regions, routes, rasters, adjacency, or geographic distance affect the model
    stages: [G1, G2, G3, "G3.5", G4, G6]
    skills: [geospatial-modeling]
  relational-system:
    when: nodes, edges, paths, flows, communities, or diffusion are modeled
    stages: [G1, G2, G3, "G3.5", G4, G6]
    skills: [network-modeling]
  formal-literature-review:
    when: user requests deep research, systematic review, formal literature review, evidence synthesis, or a defensible state-of-the-art map
    stages: [G0, G1, "G1.5", G2, "G3.5", G4, G6]
    skills: [systematic-evidence-review]
mode_routes:
  solve: [G0, G1, "G1.5", G2, G3, "G3.5", G4, G5, G6, G7]
  review: [G6]
  repair: [affected-stage, downstream-dependency-cone, G5, G6, G7]
  score: [G6]
  deliver: [G5, G6, G7]
coverage_control:
  reference: references/skill-coverage-and-rework.md
  ledger: 求解/计划/skill_use_ledger.json
  statuses: [pending, active, not_applicable, blocked, complete, superseded]
  rule: every canonical skill must have a trigger decision; active skills must leave current-revision evidence
rework_control:
  reference: references/skill-coverage-and-rework.md
  log: 求解/计划/rework_log.jsonl
  record_script: scripts/record_rework.py
  close_script: scripts/close_rework.py
  rule: material upstream changes invalidate the downstream dependency cone and require replay before refreeze
